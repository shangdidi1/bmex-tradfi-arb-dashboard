openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: arb
    description: Arbitrage analysis operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /arb/summary:
    get:
      operationId: getArbSummary
      tags: [arb]
      summary: Get arbitrage summary for all asset pairs
      description: Returns current funding rate and price spread metrics for all 9 BitMEX vs Hyperliquid asset pairs
      responses:
        "200":
          description: Summary of all pairs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArbSummaryResponse"

  /arb/{pairId}:
    get:
      operationId: getArbDetail
      tags: [arb]
      summary: Get detailed 14-day history for an asset pair
      parameters:
        - name: pairId
          in: path
          required: true
          schema:
            type: string
          description: Pair ID (e.g. "1" through "9")
      responses:
        "200":
          description: Detailed time-series data for the pair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArbDetailResponse"
        "404":
          description: Pair not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /arb/pairs:
    post:
      operationId: createArbPair
      tags: [arb]
      summary: Add a new trading pair
      description: |
        Adds a new (BitMEX, Hyperliquid) pair for tracking. Symbols are validated
        against each venue's orderbook before insert. Initial 30-day history fetch
        runs asynchronously — the pair appears in /summary in a "bootstrapping"
        state until the background job completes (~30-90s).

        No auth (self-hosted tool). Abuse guards: 30s cooldown between adds,
        max 100 pairs total, symbols must resolve on both venues.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateArbPairRequest"
      responses:
        "201":
          description: Pair created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArbPairConfig"
        "400":
          description: Invalid input or symbol not found on venue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Pair with these symbols already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Cooldown — try again in a few seconds
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /arb/pairs/{pairId}:
    delete:
      operationId: deleteArbPair
      tags: [arb]
      summary: Remove a trading pair
      description: Deletes from both trading_pairs and any existing pair_snapshot.
      parameters:
        - name: pairId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Pair deleted
        "404":
          description: Pair not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /arb/summary/live:
    get:
      operationId: getArbSummaryLive
      tags: [arb]
      summary: Live refresh of the summary across all pairs
      description: |
        Re-fetches orderbooks + current funding for all 22 pairs in parallel and recomputes
        summaries, returning the same shape as /arb/summary. Historical metrics (consistency,
        annYield, timeSeries) are carried over from the last cron refresh — this endpoint
        refreshes only the current-snapshot fields. Rate-limited to one call per 15 seconds
        server-wide.
      responses:
        "200":
          description: Live summary across all pairs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArbSummaryResponse"
        "429":
          description: Rate limited — try again in a few seconds
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /arb/{pairId}/live:
    get:
      operationId: getArbLive
      tags: [arb]
      summary: Live refresh of orderbooks + current funding for one pair
      description: |
        Fetches fresh top-of-book + current funding rate directly from BitMEX & Hyperliquid,
        bypassing the cached DB snapshot. Does NOT re-fetch 30-day history. Intended for
        on-demand per-pair refresh from the dashboard. Rate-limited to 1 call per ~10s per pair
        per server instance.
      parameters:
        - name: pairId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Fresh live snapshot for the pair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArbLiveResponse"
        "404":
          description: Pair not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limited — try again in a few seconds
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    ArbPairSummary:
      type: object
      properties:
        pairId:
          type: string
        name:
          type: string
        bitmexSymbol:
          type: string
        hlSymbol:
          type: string
        bitmexCurrentAPR:
          type: number
          description: BitMEX latest annualized funding rate (%)
        hlCurrentAPR:
          type: number
          description: Hyperliquid latest annualized funding rate (%)
        fundingSpread:
          type: number
          description: BitMEX APR minus Hyperliquid APR (%)
        priceSpreadPct:
          type: number
          description: Price basis (BitMEX price vs HL price, %)
        bitmexOpenInterestUsdt:
          type: number
          description: BitMEX open interest notional value in USDT
        consistencyScore:
          type: number
          description: 14-day percentage of 5-min periods where BitMEX funding was lower than HL (0-100)
        cumulativeYield:
          type: number
          description: 14-day cumulative arb yield (always positive, %)
        consistency7d:
          type: number
          description: 7-day consistency score (% of periods BitMEX was cheaper, 0-100)
        consistency14d:
          type: number
          description: 14-day consistency score (% of periods BitMEX was cheaper, 0-100)
        consistency30d:
          type: number
          description: 30-day consistency score (% of periods BitMEX was cheaper, 0-100)
        annYield7d:
          type: number
          description: 7-day annualized arb yield (always positive, %)
        annYield14d:
          type: number
          description: 14-day annualized arb yield (always positive, %)
        annYield30d:
          type: number
          description: 30-day annualized arb yield (always positive, %)
        suggestion:
          type: string
          enum: [LONG_BITMEX_SHORT_HL, LONG_HL_SHORT_BITMEX, NEUTRAL]
          description: Trade direction suggestion
        lastUpdated:
          type: string
          description: ISO timestamp of last data refresh
        bmexBid:
          type: number
          nullable: true
          description: BitMEX best bid price; null if orderbook fetch failed
        bmexAsk:
          type: number
          nullable: true
          description: BitMEX best ask price; null if orderbook fetch failed
        hlBid:
          type: number
          nullable: true
          description: Hyperliquid best bid price; null if orderbook fetch failed
        hlAsk:
          type: number
          nullable: true
          description: Hyperliquid best ask price; null if orderbook fetch failed
        bmexBidSize:
          type: number
          nullable: true
          description: BitMEX size at best bid, in base-coin units. Multiply by bmexBid for USD notional. Null if orderbook fetch failed.
        bmexAskSize:
          type: number
          nullable: true
          description: BitMEX size at best ask, in base-coin units. Multiply by bmexAsk for USD notional. Null if orderbook fetch failed.
        hlBidSize:
          type: number
          nullable: true
          description: Hyperliquid size at best bid, in base coin units. Null if orderbook fetch failed.
        hlAskSize:
          type: number
          nullable: true
          description: Hyperliquid size at best ask, in base coin units. Null if orderbook fetch failed.
        bmexBids:
          type: array
          nullable: true
          items: { $ref: "#/components/schemas/BookLevel" }
          description: BitMEX top-5 bid levels (highest first). Null if orderbook fetch failed.
        bmexAsks:
          type: array
          nullable: true
          items: { $ref: "#/components/schemas/BookLevel" }
          description: BitMEX top-5 ask levels (lowest first). Null if orderbook fetch failed.
        hlBids:
          type: array
          nullable: true
          items: { $ref: "#/components/schemas/BookLevel" }
          description: Hyperliquid top-5 bid levels (highest first). Null if orderbook fetch failed.
        hlAsks:
          type: array
          nullable: true
          items: { $ref: "#/components/schemas/BookLevel" }
          description: Hyperliquid top-5 ask levels (lowest first). Null if orderbook fetch failed.
        crossingCostPct:
          type: number
          nullable: true
          description: Round-trip bid-ask crossing cost as sum of both venues' own-mid spreads (%). Null if orderbook missing.
        feeCostPct:
          type: number
          description: Round-trip taker fee cost as % (4 legs total). Constant per deployment.
        priceBasisPct:
          type: number
          nullable: true
          description: |
            Current price basis (BMEX mid − HL mid) as % of avg mid. Signed: positive = BMEX pricier.
            Null when pair is scale-mismatched (e.g. SPY ETF vs SP500 index) — the raw basis has no economic meaning there.
        favorableBasisPct:
          type: number
          nullable: true
          description: |
            Basis in the trade's favor for the suggested direction (%). Positive means the current entry
            price gap works for the trade; negative means it works against. Null for scale-mismatched pairs
            or NEUTRAL suggestions (no basis adjustment applied to totalCost in those cases).
        totalCostPct:
          type: number
          nullable: true
          description: |
            Effective round-trip cost: crossingCostPct + feeCostPct − favorableBasisPct.
            Assumes the basis closes to zero at exit (correlated with funding normalization — the thesis of a funding-arb trade).
            Can be negative when favorable basis exceeds crossing+fees (net credit at entry). Null if orderbook missing.
        netAPR1d:
          type: number
          nullable: true
          description: |
            Forward-looking net APR assuming a 1-day hold:
            |funding spread APR| − totalCostPct × 365. Pessimistic; useful as an "actionable now" filter.
        netAPR7d:
          type: number
          nullable: true
          description: Same as netAPR1d but amortized over a 7-day hold.
        netAPR30d:
          type: number
          nullable: true
          description: Same as netAPR1d but amortized over a 30-day hold.
        breakevenHours:
          type: number
          nullable: true
          description: Hours needed at the current funding spread to recover totalCostPct. Null if spread is zero or cost missing.
      required:
        - pairId
        - name
        - bitmexSymbol
        - hlSymbol
        - bitmexCurrentAPR
        - hlCurrentAPR
        - fundingSpread
        - priceSpreadPct
        - bitmexOpenInterestUsdt
        - consistencyScore
        - cumulativeYield
        - consistency7d
        - consistency14d
        - consistency30d
        - annYield7d
        - annYield14d
        - annYield30d
        - suggestion
        - lastUpdated
        - feeCostPct

    ArbSummaryResponse:
      type: object
      properties:
        pairs:
          type: array
          items:
            $ref: "#/components/schemas/ArbPairSummary"
        cachedAt:
          type: string
          description: ISO timestamp when cache was last populated
      required:
        - pairs
        - cachedAt

    ArbTimeSeriesPoint:
      type: object
      properties:
        timestamp:
          type: string
          description: ISO timestamp
        bitmexAPR:
          type: number
        hlAPR:
          type: number
        fundingSpread:
          type: number
        bitmexPrice:
          type: number
        hlPrice:
          type: number
        priceSpreadPct:
          type: number
      required:
        - timestamp
        - bitmexAPR
        - hlAPR
        - fundingSpread
        - bitmexPrice
        - hlPrice
        - priceSpreadPct

    ArbDetailResponse:
      type: object
      properties:
        summary:
          $ref: "#/components/schemas/ArbPairSummary"
        timeSeries:
          type: array
          items:
            $ref: "#/components/schemas/ArbTimeSeriesPoint"
      required:
        - summary
        - timeSeries

    CreateArbPairRequest:
      type: object
      properties:
        name:
          type: string
          description: Display name for the pair, e.g. "South Korea (EWY)"
          maxLength: 80
        bitmexSymbol:
          type: string
          description: BitMEX symbol, e.g. "EWYUSDT"
          maxLength: 40
        hlSymbol:
          type: string
          description: Hyperliquid symbol, e.g. "xyz:EWY"
          maxLength: 40
      required:
        - name
        - bitmexSymbol
        - hlSymbol

    ArbPairConfig:
      type: object
      description: The pair's identity and venue symbols (not the market data — see ArbPairSummary for that).
      properties:
        pairId:
          type: string
        name:
          type: string
        bitmexSymbol:
          type: string
        hlSymbol:
          type: string
      required:
        - pairId
        - name
        - bitmexSymbol
        - hlSymbol

    BookLevel:
      type: object
      properties:
        px:
          type: number
          description: Price at this level
        size:
          type: number
          description: Size at this level in base-coin units
      required:
        - px
        - size

    ArbLiveResponse:
      type: object
      description: Live on-demand snapshot (orderbooks + current funding) for one pair. Not persisted.
      properties:
        pairId:
          type: string
        name:
          type: string
        bitmexSymbol:
          type: string
        hlSymbol:
          type: string
        bitmexCurrentAPR:
          type: number
        hlCurrentAPR:
          type: number
        bmexBids:
          type: array
          nullable: true
          items: { $ref: "#/components/schemas/BookLevel" }
        bmexAsks:
          type: array
          nullable: true
          items: { $ref: "#/components/schemas/BookLevel" }
        hlBids:
          type: array
          nullable: true
          items: { $ref: "#/components/schemas/BookLevel" }
        hlAsks:
          type: array
          nullable: true
          items: { $ref: "#/components/schemas/BookLevel" }
        fetchedAt:
          type: string
          description: ISO timestamp when the live fetch completed
      required:
        - pairId
        - name
        - bitmexSymbol
        - hlSymbol
        - bitmexCurrentAPR
        - hlCurrentAPR
        - fetchedAt
